services:
  xianyu-monitor:
    build: .
    image: xianyu-monitor:latest
    ports:
      - "5000:5000"
    volumes:
      - ./browser_profile:/app/browser_profile
      - ./data:/app/data
    restart: unless-stopped
    # 有头模式由容器内 Xvfb 虚拟显示提供（规避闲鱼对无头浏览器的拦截），
    # 不再由 MONITOR_HEADLESS 强制为 1；如需显式控制可在 .env 覆盖。
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
    # 数据卷属主由 entrypoint.sh 以 root 修正后降权运行，避免宿主目录权限问题
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s